<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080812"><title>جزئیات پروژه | NOVA CODE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#080812;--panel:#121222;--line:#302b4b;--purple:#a78bfa;--cyan:#50dfff;--muted:#b5b1ca}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#33205266,transparent 38%),radial-gradient(ellipse at 90% 45%,#12384b55,transparent 38%),var(--bg);color:#f8f7ff;font-family:Vazirmatn,sans-serif;line-height:1.9}a{color:inherit;text-decoration:none}.wrap{width:min(980px,calc(100% - 32px));margin:auto}nav{padding:16px 0;border-bottom:1px solid #ffffff14;display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:22px;font-weight:900}.logo b{color:var(--purple)}.back{border:1px solid #ffffff20;border-radius:11px;padding:8px 14px;color:#ded7ff}.hero{margin:28px 0 22px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#11111f;box-shadow:0 22px 70px #0004}.visual{max-height:480px;background:#080811}.visual img,.visual video{display:block;width:100%;max-height:480px;object-fit:contain}.intro{padding:clamp(20px,5vw,38px)}.tag{display:inline-block;padding:5px 12px;border-radius:99px;color:#d6caff;background:#8b5cf61c;border:1px solid #8b5cf644;font-size:12px}.h1{font-size:clamp(25px,5vw,42px);line-height:1.45;margin:14px 0 8px}.desc{color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.desc.collapsed{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:8;line-clamp:8;overflow:hidden}.desc:not(.collapsed){display:block}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}.panel{border:1px solid var(--line);border-radius:20px;padding:22px;background:linear-gradient(145deg,#ffffff0b,#ffffff03);min-width:0}.panel h2{font-size:19px;margin:0 0 14px;color:#e8e1ff}.connections{white-space:pre-wrap;color:#d1cde0}.code{direction:ltr;text-align:left;white-space:pre;overflow:auto;max-height:600px;background:#070710;border:1px solid #ffffff12;border-radius:12px;padding:16px;color:#c9d7ff;font:13px/1.8 ui-monospace,monospace}.copy,.read-more{font-family:inherit;border:0;border-radius:10px;padding:10px 16px;background:linear-gradient(120deg,#7c3aed,#2563eb);color:white;font-weight:700;cursor:pointer}.article-panel{margin:0;border:0;border-top:1px solid var(--line);border-radius:0;padding:clamp(20px,5vw,38px);background:transparent;box-shadow:none}.article-body{white-space:pre-wrap;overflow-wrap:anywhere;color:#d5d2e5;line-height:2.15;font-size:15px}.article-body.collapsed{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:8;line-clamp:8;overflow:hidden}.article-body:not(.collapsed){display:block}.article-actions{display:flex;justify-content:center;margin-top:18px}.empty{text-align:center;padding:70px 20px;color:var(--muted)}footer{text-align:center;color:#77758f;padding:30px 10px;font-size:12px}@media(max-width:650px){.layout{grid-template-columns:1fr}.wrap{width:min(100% - 22px,980px)}nav{padding:12px 0}.hero{margin-top:16px;border-radius:17px}.panel{padding:17px}.visual img,.visual video{max-height:330px}.code{font-size:12px;max-height:460px}.article-body{font-size:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body><div class="wrap"><nav><a class="logo" href="index.html">NOVA <b>CODE ✦</b></a><a class="back" href="index.html#projects">← بازگشت به پروژه‌ها</a></nav><main id="app"><div class="empty">در حال بارگذاری پروژه…</div></main><footer>© ۲۰۲۶ NOVA CODE — ساخته‌شده با خلاقیت و فناوری</footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(() => {
'use strict';
const SUPABASE_URL='https://submxfpbsnppytyjjdxb.supabase.co';
const SUPABASE_KEY='sb_publishable_1PcbKVYuAgEYJ97j60685w_kTyFtR6d';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
const id=new URLSearchParams(location.search).get('id');
function showError(title,msg){app.innerHTML=`<div class="empty"><h2>${esc(title)}</h2><p>${esc(msg)}</p><a class="back" href="index.html#projects">بازگشت به پروژه‌ها</a></div>`;}
async function init(){
 try{
  if(!id)throw new Error('شناسه پروژه در نشانی صفحه وجود ندارد.');
  if(!window.supabase?.createClient)throw new Error('کتابخانه اتصال به پایگاه داده بارگذاری نشد.');
  const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  const {data:p,error}=await client.from('novacode_projects').select('*').eq('id',id).eq('is_published',true).maybeSingle();
  if(error)throw error;
  if(!p)throw new Error('این پروژه پیدا نشد یا هنوز منتشر نشده است.');
  document.title=p.title+' | NOVA CODE';
  const media=p.video_url?`<video src="${esc(p.video_url)}" controls playsinline preload="metadata"></video>`:p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.title)}">`:'';
  const article=p.long_description||p.description||'';
  app.innerHTML=`
   <article class="hero"><div class="visual">${media}</div><div class="intro"><span class="tag">${esc(p.category||'پروژه')}</span><h1 class="h1">${esc(p.title)}</h1><div id="summaryBody" class="desc collapsed">${esc(p.description||'')}</div>${p.external_url?`<p><a class="back" href="${esc(p.external_url)}" target="_blank" rel="noopener noreferrer">مشاهده لینک پروژه ↗</a></p>`:''}</div>
   ${article?`<section class="article-panel"><h2>📘 آموزش و توضیحات کامل پروژه</h2><div id="articleBody" class="article-body collapsed">${esc(article)}</div><div class="article-actions"><button class="read-more" id="readMore" type="button">بیشتر بخوانید ↓</button></div></section>`:''}</article>
   <div class="layout"><section class="panel"><h2>🔌 اتصال قطعات و راه‌اندازی</h2><div class="connections">${esc(p.connections||'اطلاعات اتصال قطعات هنوز ثبت نشده است.')}</div></section><section class="panel"><h2>⌘ کد کامل پروژه</h2>${p.code?`<button class="copy" id="copy">کپی کد پروژه</button><pre class="code" id="code">${esc(p.code)}</pre>`:'<p class="connections">برای این پروژه کدی ثبت نشده است.</p>'}</section></div>`;
  const more=document.getElementById('readMore');
  if(more)more.addEventListener('click',()=>{const body=document.getElementById('articleBody');const opening=body.classList.contains('collapsed');body.classList.toggle('collapsed');more.textContent=opening?'بستن توضیحات ↑':'بیشتر بخوانید ↓';if(opening)body.scrollIntoView({behavior:'smooth',block:'start'});});
  const copy=document.getElementById('copy');
  if(copy)copy.addEventListener('click',async()=>{try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(p.code);else{const ta=document.createElement('textarea');ta.value=p.code;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy');}copy.textContent='✓ کپی شد!';}catch(e){copy.textContent='کپی خودکار ممکن نشد؛ کد را دستی انتخاب کن.';}});
 }catch(e){console.error(e);showError('نمایش پروژه ناموفق بود',e.message||'خطای ناشناخته');}
}
init();
})();
</script></body></html>
