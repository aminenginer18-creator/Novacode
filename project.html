<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080812"><title>جزئیات پروژه | NOVA CODE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#080812;--panel:#121222;--line:#302b4b;--purple:#a78bfa;--cyan:#50dfff;--muted:#b5b1ca}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#33205266,transparent 38%),radial-gradient(ellipse at 90% 45%,#12384b55,transparent 38%),var(--bg);color:#f8f7ff;font-family:Vazirmatn,sans-serif;line-height:1.9}a{color:inherit;text-decoration:none}.wrap{width:min(980px,calc(100% - 32px));margin:auto}nav{padding:16px 0;border-bottom:1px solid #ffffff14;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:900}.logo b{color:var(--purple)}.back{border:1px solid #ffffff20;border-radius:11px;padding:8px 14px;color:#ded7ff}.hero{margin:28px 0 22px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#11111f;box-shadow:0 22px 70px #0004}.visual{max-height:480px;background:#080811}.visual img,.visual video{display:block;width:100%;max-height:480px;object-fit:contain}.intro{padding:clamp(20px,5vw,38px)}.tag{display:inline-block;padding:5px 12px;border-radius:99px;color:#d6caff;background:#8b5cf61c;border:1px solid #8b5cf644;font-size:12px}.h1{font-size:clamp(25px,5vw,42px);line-height:1.45;margin:14px 0 8px}.desc{color:var(--muted);white-space:pre-wrap}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}.panel{border:1px solid var(--line);border-radius:20px;padding:22px;background:linear-gradient(145deg,#ffffff0b,#ffffff03);min-width:0}.panel h2{font-size:19px;margin:0 0 14px;color:#e8e1ff}.connections{white-space:pre-wrap;color:#d1cde0}.code{direction:ltr;text-align:left;white-space:pre;overflow:auto;max-height:600px;background:#070710;border:1px solid #ffffff12;border-radius:12px;padding:16px;color:#c9d7ff;font:13px/1.8 ui-monospace,monospace}.copy{font-family:inherit;border:0;border-radius:10px;padding:10px 16px;background:linear-gradient(120deg,#7c3aed,#2563eb);color:white;font-weight:700;cursor:pointer}.copy:active{transform:scale(.98)}.empty{text-align:center;padding:70px 20px;color:var(--muted)}footer{text-align:center;color:#77758f;padding:30px 10px;font-size:12px}@media(max-width:650px){.layout{grid-template-columns:1fr}.wrap{width:min(100% - 22px,980px)}nav{padding:12px 0}.hero{margin-top:16px;border-radius:17px}.panel{padding:17px}.visual img,.visual video{max-height:330px}.code{font-size:12px;max-height:460px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body><div class="wrap"><nav><a class="logo" href="index.html">NOVA <b>CODE ✦</b></a><a class="back" href="index.html#projects">← بازگشت به پروژه‌ها</a></nav><main id="app"><div class="empty">در حال بارگذاری پروژه…</div></main><footer>© ۲۰۲۶ NOVA CODE — ساخته‌شده با خلاقیت و فناوری</footer></div><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let projects=[];try{projects=JSON.parse(localStorage.getItem("novaProjects")||"[]")}catch(e){}const id=new URLSearchParams(location.search).get("id"),p=projects.find(x=>String(x.id)===String(id)),app=document.getElementById("app");
if(!p){app.innerHTML='<div class="empty"><h2>پروژه پیدا نشد</h2><p>ممکن است پروژه حذف شده باشد یا این صفحه مستقیماً باز شده باشد.</p><a class="back" href="index.html#projects">بازگشت به سایت</a></div>'}else{document.title= p.title+' | NOVA CODE';app.innerHTML=`<article class="hero"><div class="visual">${p.video?`<video src="${esc(p.video)}" controls playsinline preload="metadata"></video>`:p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}">`:''}</div><div class="intro"><span class="tag">${esc(p.tag||'پروژه')}</span><h1 class="h1">${esc(p.title)}</h1><div class="desc">${esc(p.description||'توضیحات این پروژه به‌زودی اضافه می‌شود.')}</div>${p.url?`<p><a class="back" href="${esc(p.url)}" target="_blank" rel="noopener">مشاهده پروژه ↗</a></p>`:''}</div></article><div class="layout">${p.connections?`<section class="panel"><h2>🔌 اتصال قطعات و راه‌اندازی</h2><div class="connections">${esc(p.connections)}</div></section>`:`<section class="panel"><h2>🔌 اتصال قطعات</h2><p class="connections">اطلاعات اتصال قطعات هنوز ثبت نشده است.</p></section>`}${p.code?`<section class="panel"><h2>⌘ کد کامل پروژه</h2><button class="copy" id="copy">کپی کد پروژه</button><pre class="code" id="code">${esc(p.code)}</pre></section>`:`<section class="panel"><h2>⌘ کد پروژه</h2><p class="connections">برای این پروژه کدی ثبت نشده است.</p></section>`}</div>`;const btn=document.getElementById('copy');if(btn)btn.addEventListener('click',async()=>{const text=p.code;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy')}btn.textContent='✓ کپی شد!';}catch(e){const pre=document.getElementById('code'),r=document.createRange(),s=window.getSelection();r.selectNodeContents(pre);s.removeAllRanges();s.addRange(r);btn.textContent='کد انتخاب شد؛ کپی را بزنید';}})}
</script></body></html>
